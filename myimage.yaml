apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx1
  template:
    metadata:
      labels:
        app: nginx1
    spec:
      containers:
      - name: nginx1
        image: akhiakhi1/nginx_p1:latest
        ports:
        - containerPort: 80
      imagePullSecrets:
      - name: my-registery-name